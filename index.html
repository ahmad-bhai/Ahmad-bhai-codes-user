<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Magic Scripts Users - Control Center</title>
<link rel="icon" href="https://magic-scripts-code-users.vercel.app/logo.svg" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #080711;
  --panel: rgba(20, 14, 38, 0.75);
  --card: #120d26;
  --input-bg: rgba(10, 6, 20, 0.85);
  --border: rgba(168, 85, 247, 0.25);
  --primary: #a855f7;
  --secondary: #ec4899;
  --accent: #f3e8ff;
  --accent-glow: rgba(236, 72, 153, 0.4);
  --text: #f3e8ff;
  --text-muted: #a78bfa;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

body {
  background: var(--bg);
  background-image: 
    radial-gradient(at 10% 10%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
    radial-gradient(at 90% 90%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 40px;
}

/* ─── HEADER ─── */
header {
  background: rgba(15, 11, 28, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.brand-title {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ─── 3D FLIP CONTAINER ENGINE ─── */
.login-wrapper {
  perspective: 1200px;
  max-width: 440px;
  margin: 40px auto;
  padding: 0 16px;
  width: 100%;
}

.flip-card {
  width: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.flip-card.flipped {
  transform: rotateY(180deg);
}

.card-face {
  width: 100%;
  backface-visibility: hidden;
  border-radius: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  padding: 30px 24px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
}

.card-front { transform: rotateY(0deg); }
.card-back {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* ─── FORM & INPUTS ─── */
.form-logo {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: block;
  box-shadow: 0 0 20px var(--accent-glow);
  border: 2px solid var(--primary);
}

.input-group {
  margin-bottom: 16px;
  text-align: left;
  position: relative;
}

.input-group label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.password-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

input {
  width: 100%;
  padding: 12px 16px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: #fff;
  outline: none;
  font-size: 14px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--accent-glow);
}

.eye-btn {
  position: absolute;
  right: 14px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
}

.eye-btn:hover { color: var(--primary); }

/* ─── GLOWING BUTTONS ─── */
.btn-glow {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none;
  border-radius: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px var(--accent-glow);
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

.btn-glow:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(236, 72, 153, 0.6);
}

.btn-glow:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-danger {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
}

/* ─── CUSTOM FLAG SELECTOR CSS ─── */
.flag-label {
  display: block;
  margin: 12px 0 6px 5px;
  font-size: 12px;
  font-weight: bold;
  opacity: 0.8;
  color: var(--text-muted);
}

.flag-selector {
  position: relative;
  width: 100%;
  margin-bottom: 15px;
  user-select: none;
  z-index: 99;
}

.flag-selector-header {
  background: var(--input-bg);
  border: 1px solid var(--border);
  padding: 12px 14px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: 0.3s ease;
}

.flag-selector-header:hover {
  border-color: var(--primary);
}

.selected-flag {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--accent);
  font-weight: bold;
  font-size: 14px;
}

.flag-icon {
  width: 24px;
  height: 18px;
  object-fit: cover;
  border-radius: 3px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.flag-chevron {
  width: 20px;
  height: 20px;
  fill: var(--primary);
  transition: transform 0.35s cubic-bezier(.175,.885,.32,1.275);
}

.flag-selector.open .flag-chevron {
  transform: rotate(180deg);
}

.flag-dropdown-list {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  max-height: 220px;
  overflow-y: auto;
  padding: 6px;
  opacity: 0;
  transform: translateY(-15px) scale(.97);
  pointer-events: none;
  box-shadow: 0 15px 35px rgba(0,0,0,.8);
  transition: opacity .3s ease, transform .3s cubic-bezier(.175,.885,.32,1.275);
}

.flag-selector.open .flag-dropdown-list {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.flag-dropdown-list::-webkit-scrollbar { width: 6px; }
.flag-dropdown-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
.flag-dropdown-list::-webkit-scrollbar-thumb:hover { background: var(--primary); }

.flag-item {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  transition: .2s ease;
}

.flag-item:hover {
  background: rgba(196,1,255,.15);
  color: var(--primary);
  transform: translateX(4px);
}

.flag-item.active {
  background: var(--primary);
  color: white !important;
}

/* ─── CUSTOM ALERT DIALOG MODAL ─── */
.dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.dialog-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.dialog-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  width: 90%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
  transform: scale(0.8);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.dialog-overlay.active .dialog-box {
  transform: scale(1);
}

.dialog-icon {
  font-size: 40px;
  color: var(--danger);
  margin-bottom: 12px;
}

.dialog-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.dialog-msg {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

/* ─── LOADER ANIMATION ─── */
.pulse-loader {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  animation: pulse 1.2s infinite ease-in-out;
  margin-top: 20px;
}

@keyframes pulse {
  0% { transform: scale(0.8); opacity: 0.5; }
  50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 25px var(--secondary); }
  100% { transform: scale(0.8); opacity: 0.5; }
}

/* ─── OPEN GROUND DASHBOARD LAYOUT ─── */
.dashboard-container {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 16px;
}

.card-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(16px);
  margin-bottom: 24px;
}

.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.user-card {
  background: rgba(15, 11, 28, 0.65);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  transition: all 0.3s ease;
}

.user-card:hover {
  border-color: var(--secondary);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
}

.badge {
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge-paid { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
.badge-pending { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="brand-title">
    <i class="fa-solid fa-wand-magic-sparkles"></i> Magic Scripts Users
  </div>
  <button id="logoutBtn" class="btn-glow btn-danger" style="display:none; width:auto; padding: 8px 16px;">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</header>

<!-- LOGIN SCREEN WITH 3D FLIP CONTAINER -->
<div id="loginScreen" class="login-wrapper">
  <div class="flip-card" id="flipCard">
    
    <!-- CARD FRONT: LOGIN FORM -->
    <div class="card-face card-front">
      <img src="https://magic-scripts-code-users.vercel.app/logo.svg" class="form-logo" alt="Logo">
      <h2 style="margin-bottom: 18px; text-align: center; font-size: 20px;">Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <label><i class="fa-solid fa-envelope"></i> Email</label>
          <input id="loginEmail" type="email" placeholder="email@gmail.com" required>
        </div>
        <div class="input-group">
          <label><i class="fa-solid fa-lock"></i> Password</label>
          <div class="password-wrapper">
            <input id="loginPass" type="password" required>
            <button type="button" class="eye-btn" id="toggleLoginPass">
              <i class="fa-solid fa-eye" id="loginPassIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-glow" style="margin-top: 10px;">
          <i class="fa-solid fa-bolt"></i> Login Me!
        </button>
      </form>
    </div>

    <!-- CARD BACK: SUCCESS & LOADING ANIMATION -->
    <div class="card-face card-back">
      <i class="fa-solid fa-circle-check" style="font-size: 48px; color: var(--secondary); margin-bottom: 10px;"></i>
      <h2 style="font-size: 19px;">Thank you for login me!</h2>
      <p style="color: var(--text-muted); font-size: 12px; margin-top: 4px;">Opening dashboard area...</p>
      <div class="pulse-loader"></div>
    </div>

  </div>
</div>

<!-- MAIN OPEN GROUND DASHBOARD -->
<div id="dashboardApp" class="dashboard-container" style="display: none;">
  <div class="card-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <h3><i class="fa-solid fa-user-plus" style="color: var(--primary);"></i> Add User Profile</h3>
      <button id="toggleFormBtn" class="btn-glow" style="width: auto; padding: 8px 16px;">
        <i class="fa-solid fa-plus"></i>Add User
      </button>
    </div>

    <form id="addUserForm" style="display: none; margin-top: 20px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
        <div class="input-group"><label>Email</label><input id="u_email" type="email"></div>
        <div class="input-group"><label>Name</label><input id="u_name" type="text"></div>
        <div class="input-group"><label>Trader ID (8 Digits)</label><input id="u_trader" type="text" maxlength="8"></div>
        <div class="input-group"><label>Date</label><input id="u_date" type="date"></div>
      </div>

      <!-- CUSTOM FLAG DROPDOWN COMPONENT -->
      <label class="flag-label">Select User Country / Flag:</label>
      <div class="flag-selector" id="flagDropdown">
          <div class="flag-selector-header" id="flagHeader">
              <span class="selected-flag">
                  <img src="https://flagcdn.com/24x18/pk.png" class="flag-icon" id="currentFlagImg" alt="Pakistan">
                  <span id="currentCountryName">Pakistan</span>
              </span>
              <svg class="flag-chevron" viewBox="0 0 24 24">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6-6 1.41-1.41z"/>
              </svg>
          </div>
          <div class="flag-dropdown-list" id="dropdownList"></div>
      </div>

      <button type="button" id="confirmSaveBtn" class="btn-glow" disabled style="margin-top: 10px;">
        <i class="fa-solid fa-floppy-disk"></i> Confirm & Save Profile
      </button>
    </form>
  </div>

  <!-- Search & Counter Control -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
    <div><i class="fa-solid fa-users" style="color: var(--secondary);"></i> Total Users: <strong id="userCounter" style="color: var(--primary);">0</strong></div>
    <div style="width: 250px; max-width: 100%;">
      <input type="text" id="searchInput" placeholder="Search user name...">
    </div>
  </div>

  <!-- Cards Grid -->
  <div id="usersGrid" class="grid-cards"></div>
</div>

<!-- CUSTOM DIALOG ALERT MODAL -->
<div class="dialog-overlay" id="customDialog">
  <div class="dialog-box">
    <div class="dialog-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="dialog-title" id="dialogTitle">Error</div>
    <div class="dialog-msg" id="dialogMsg">Something went wrong!</div>
    <button class="btn-glow" id="dialogCloseBtn">OK</button>
  </div>
</div>

<script type="module">
  const API_URL = "https://magic-scripts-code-users.vercel.app/c";
  const STORAGE_KEY = "magic_user_session_token";
  const $ = s => document.querySelector(s);

  // SESSION STORAGE ENGINE (Survives Page Refresh, Clears on Tab Close)
  function getToken() { 
    return sessionStorage.getItem(STORAGE_KEY) || ""; 
  }
  function setToken(t) { 
    if (t) sessionStorage.setItem(STORAGE_KEY, t);
    else sessionStorage.removeItem(STORAGE_KEY);
  }

  // Custom Alert Dialog Modal
  function showCustomAlert(title, message) {
    $("#dialogTitle").textContent = title;
    $("#dialogMsg").textContent = message;
    $("#customDialog").classList.add("active");
  }

  $("#dialogCloseBtn").onclick = () => {
    $("#customDialog").classList.remove("active");
  };

  // Immediate Hard Logout Trigger
  async function forceLogout(reasonMessage = "Session Expired or Network Interrupted!") {
    const currentToken = getToken();
    if (currentToken) {
      try {
        await fetch(`${API_URL}?action=logout`, { headers: { "Authorization": currentToken } });
      } catch(e){}
    }
    
    setToken("");
    $("#dashboardApp").style.display = "none";
    $("#logoutBtn").style.display = "none";
    $("#loginScreen").style.display = "block";

    setTimeout(() => {
      $("#flipCard").classList.remove("flipped");
      $("#loginForm").reset();
    }, 100);

    if (reasonMessage) {
      showCustomAlert("Security Alert", reasonMessage);
    }
  }

  // ─── AGGRESSIVE NETWORK & SECURITY LISTENERS ───
  window.addEventListener('offline', () => {
    forceLogout("Internet connection lost. You have been logged out for security!");
  });

  // Password Toggle
  $("#toggleLoginPass").onclick = () => {
    const input = $("#loginPass");
    const icon = $("#loginPassIcon");
    if(input.type === "password") {
      input.type = "text";
      icon.className = "fa-solid fa-eye-slash";
    } else {
      input.type = "password";
      icon.className = "fa-solid fa-eye";
    }
  };

  // Countries Flag Engine A-Z
  const allCountriesMap = {
    "Afghanistan":"af","Albania":"al","Algeria":"dz","Andorra":"ad","Angola":"ao","Argentina":"ar","Armenia":"am","Australia":"au","Austria":"at","Azerbaijan":"az","Bahamas":"bs","Bahrain":"bh","Bangladesh":"bd","Barbados":"bb","Belarus":"by","Belgium":"be","Belize":"bz","Benin":"bj","Bhutan":"bt","Bolivia":"bo","Bosnia and Herzegovina":"ba","Botswana":"bw","Brazil":"br","Brunei":"bn","Bulgaria":"bg","Burkina Faso":"bf","Burundi":"bi","Cambodia":"kh","Cameroon":"cm","Canada":"ca","Chile":"cl","China":"cn","Colombia":"co","Costa Rica":"cr","Croatia":"hr","Cuba":"cu","Cyprus":"cy","Czechia":"cz","Denmark":"dk","Djibouti":"dj","Dominica":"dm","Dominican Republic":"do","Ecuador":"ec","Egypt":"eg","El Salvador":"sv","Estonia":"ee","Ethiopia":"et","Fiji":"fj","Finland":"fi","France":"fr","Gabon":"ga","Georgia":"ge","Germany":"de","Ghana":"gh","Greece":"gr","Guatemala":"gt","Haiti":"ht","Honduras":"hn","Hungary":"hu","Iceland":"is","India":"in","Indonesia":"id","Iran":"ir","Iraq":"iq","Ireland":"ie","Israel":"il","Italy":"it","Jamaica":"jm","Japan":"jp","Jordan":"jo","Kazakhstan":"kz","Kenya":"ke","Kuwait":"kw","Kyrgyzstan":"kg","Laos":"la","Latvia":"lv","Lebanon":"lb","Libya":"ly","Lithuania":"lt","Luxembourg":"lu","Madagascar":"mg","Malaysia":"my","Maldives":"mv","Mali":"ml","Malta":"mt","Mexico":"mx","Moldova":"md","Monaco":"mc","Mongolia":"mn","Montenegro":"me","Morocco":"ma","Mozambique":"mz","Myanmar":"mm","Nepal":"np","Netherlands":"nl","New Zealand":"nz","Nicaragua":"ni","Niger":"ne","Nigeria":"ng","North Korea":"kp","Norway":"no","Oman":"om","Pakistan":"pk","Palestine":"ps","Panama":"pa","Paraguay":"py","Peru":"pe","Philippines":"ph","Poland":"pl","Portugal":"pt","Qatar":"qa","Romania":"ro","Russia":"ru","Rwanda":"rw","Saudi Arabia":"sa","Senegal":"sn","Serbia":"rs","Singapore":"sg","Slovakia":"sk","Slovenia":"si","Somalia":"so","South Africa":"za","South Korea":"kr","Spain":"es","Sri Lanka":"lk","Sudan":"sd","Sweden":"se","Switzerland":"ch","Syria":"sy","Taiwan":"tw","Tajikistan":"tj","Tanzania":"tz","Thailand":"th","Turkey":"tr","Turkmenistan":"tm","Uganda":"ug","Ukraine":"ua","United Arab Emirates":"ae","United Kingdom":"gb","United States":"us","Uruguay":"uy","Uzbekistan":"uz","Venezuela":"ve","Vietnam":"vn","Yemen":"ye","Zambia":"zm","Zimbabwe":"zw"
  };

  let selectedCountryName = "Pakistan";
  const dropdownList = $("#dropdownList");

  Object.keys(allCountriesMap).sort().forEach(cName => {
    const code = allCountriesMap[cName];
    const item = document.createElement("div");
    item.className = `flag-item ${cName === "Pakistan" ? "active" : ""}`;
    item.innerHTML = `
      <img src="https://flagcdn.com/24x18/${code}.png" class="flag-icon" alt="${cName}">
      <span>${cName}</span>
    `;
    item.onclick = (e) => {
      e.stopPropagation();
      selectedCountryName = cName;
      $("#currentFlagImg").src = `https://flagcdn.com/24x18/${code}.png`;
      $("#currentCountryName").textContent = cName;
      document.querySelectorAll(".flag-item").forEach(el => el.classList.remove("active"));
      item.classList.add("active");
      $("#flagDropdown").classList.remove("open");
      validateInputs();
    };
    dropdownList.appendChild(item);
  });

  $("#flagHeader").onclick = () => $("#flagDropdown").classList.toggle("open");

  document.addEventListener("click", (e) => {
    if(!$("#flagDropdown").contains(e.target)) $("#flagDropdown").classList.remove("open");
  });

  // Login Handle
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const res = await fetch(`${API_URL}?action=login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $("#loginEmail").value.trim(), password: $("#loginPass").value })
      });
      const result = await res.json();
      
      if(result.success && result.token) {
        setToken(result.token);
        
        $("#flipCard").classList.add("flipped");

        setTimeout(() => {
          $("#loginScreen").style.display = "none";
          $("#dashboardApp").style.display = "block";
          $("#logoutBtn").style.display = "block";
          renderPagesFirebase();
        }, 2200);

      } else {
        showCustomAlert("Login Failed", "Incorrect email or password entered!");
      }
    } catch(err) {
      showCustomAlert("Network Error", "Unable to establish connection with server!");
    }
  };

  $("#logoutBtn").onclick = () => forceLogout("You logged out successfully!");

  $("#toggleFormBtn").onclick = () => {
    const f = $("#addUserForm");
    f.style.display = f.style.display === "none" ? "block" : "none";
  };

  function validateInputs() {
    const ok = /^[0-9]{8}$/.test($("#u_trader").value.trim());
    $("#confirmSaveBtn").disabled = !($("#u_email").value.trim() && $("#u_name").value.trim() && ok && $("#u_date").value && selectedCountryName);
  }
  ["u_email","u_name","u_trader","u_date"].forEach(id => $("#"+id).oninput = validateInputs);

  // Save User Action
  $("#confirmSaveBtn").onclick = async () => {
    const u = {
      email: $("#u_email").value.trim(),
      name: $("#u_name").value.trim(),
      traderID: $("#u_trader").value.trim(),
      date: $("#u_date").value,
      country: selectedCountryName
    };
    try {
      const res = await fetch(`${API_URL}?action=add`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": getToken() },
        body: JSON.stringify(u)
      });
      const status = await res.json();
      if(status.success) {
        $("#addUserForm").reset(); 
        $("#addUserForm").style.display = "none";
        renderPagesFirebase();
      } else {
        forceLogout(status.error || "Security token rejected!");
      }
    } catch(err) { 
      forceLogout("Network error occurred while saving!"); 
    }
  };

  // Render Cards Action
  async function renderPagesFirebase() {
    const grid = $("#usersGrid");
    grid.innerHTML = "";

    try {
      const res = await fetch(`${API_URL}?action=load`, { headers: { "Authorization": getToken() } });
      const responseData = await res.json();

      if(!responseData.success) {
        forceLogout(responseData.error || "Session Invalid or Multi-Device Detected!");
        return;
      }

      const data = responseData.data;
      const keys = data ? Object.keys(data) : [];
      $("#userCounter").textContent = keys.length;

      keys.forEach((key, i) => {
        const p = data[key];
        const countryCode = allCountriesMap[p.country] || "pk";
        const isPaid = Boolean(p.paidStatus);

        const card = document.createElement("div");
        card.className = "user-card";
        card.setAttribute("data-name", p.name.toLowerCase());
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong style="font-size:15px;">${i+1}. ${p.name}</strong>
            <span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">
              <i class="fa-solid ${isPaid ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
              ${isPaid ? 'PAID' : 'PENDING'}
            </span>
          </div>

          <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); margin: 8px 0;">
            <img src="https://flagcdn.com/24x18/${countryCode}.png" class="flag-icon" alt="${p.country}">
            <span>${p.country}</span>
          </div>

          <div style="margin: 10px 0; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="pay_${key}" ${isPaid ? "checked" : ""} style="width:16px; height:16px; cursor:pointer;">
            <label for="pay_${key}" style="font-size:11px; color:var(--text-muted); cursor:pointer;">Payment Active</label>
          </div>

          <div style="display:flex; gap:8px;">
            <button class="btn-glow openBtn" style="flex:1; padding:6px 10px; font-size:12px;"><i class="fa-solid fa-eye"></i> View</button>
            <button class="btn-glow btn-danger removeBtn" style="padding:6px 10px; font-size:12px;"><i class="fa-solid fa-trash"></i></button>
          </div>

          <div class="page-detail" style="display:none; background:rgba(0,0,0,0.4); padding:10px; border-radius:8px; margin-top:10px; font-size:12px; color:var(--text-muted);">
            <div>Email: ${p.email}</div>
            <div>TraderID: ${p.traderID}</div>
            <div>Date: ${p.date}</div>
            <button class="hideBtn" style="margin-top:6px; background:none; border:none; color:var(--primary); cursor:pointer;">Close</button>
          </div>`;

        card.querySelector(`#pay_${key}`).onchange = async (e) => {
          try {
            const updRes = await fetch(`${API_URL}?action=updatePayment&userKey=${key}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", "Authorization": getToken() },
              body: JSON.stringify({ paidStatus: e.target.checked })
            });
            const updData = await updRes.json();
            if(!updData.success) {
              forceLogout("Payment update rejected. Logged out!");
              return;
            }
            renderPagesFirebase();
          } catch(err) {
            forceLogout("Network error during payment update!");
          }
        };

        card.querySelector(".openBtn").onclick = () => card.querySelector(".page-detail").style.display = "block";
        card.querySelector(".hideBtn").onclick = () => card.querySelector(".page-detail").style.display = "none";
        
        card.querySelector(".removeBtn").onclick = async () => {
          try {
            const delRes = await fetch(`${API_URL}?action=delete&userKey=${key}`, { headers: { "Authorization": getToken() } });
            const delData = await delRes.json();
            if(!delData.success) {
              forceLogout("Delete failed. Token invalid!");
              return;
            }
            renderPagesFirebase();
          } catch(err) {
            forceLogout("Network issue on delete!");
          }
        };

        grid.appendChild(card);
      });

      $("#searchInput").oninput = (e) => {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll(".user-card").forEach(card => {
          card.style.display = card.getAttribute("data-name").includes(query) ? "block" : "none";
        });
      };

    } catch(e){
      forceLogout("Network communication broken!");
    }
  }

  // AUTO RESTORE ON PAGE REFRESH
  if(getToken()) {
    $("#loginScreen").style.display = "none";
    $("#dashboardApp").style.display = "block";
    $("#logoutBtn").style.display = "block";
    renderPagesFirebase();
  }
</script>
</body>
</html>
